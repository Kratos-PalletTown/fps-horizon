plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting with 1.20.5+, so target Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Cloth Config"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "TerraformersMC (Mod Menu)"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // Fabric loader + Minecraft + official (Mojang) mappings.
    // Using official mappings keeps field/method names identical to the
    // NeoForge source (lastViewDistance, renderChunkLayer, etc.) which is
    // why almost none of the mixin bodies had to change during the port.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Fabric API - needed for ClientTickEvents, keybindings, etc.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Mod Menu - shows the config button in the mod list screen.
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    // Cloth Config - powers the settings screen (see KratosConfigScreen).
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    // Sodium (real Fabric build). Required at compile time because several
    // mixins target Sodium's internal classes (SodiumWorldRenderer,
    // RenderSectionManager, OcclusionCuller, RenderSection...). These are
    // the SAME class/package names Sodium uses on NeoForge, so the mixin
    // bodies port over almost unchanged.
    //
    // IMPORTANT: verify this is still the latest 1.21.1 Sodium version
    // before building - https://modrinth.com/mod/sodium/versions
    modImplementation "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version,
                "mod_id": mod_id,
                "mod_name": mod_name,
                "mod_license": mod_license
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        // Add repositories to publish to here.
    }
}
