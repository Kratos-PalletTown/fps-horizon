modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="kratos.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="pack.png"
authors="Kratos"
description='''
FPS Horizon dynamically adjusts the render distance based on your average FPS, keeping the game smooth without manual tweaking. When performance drops, the view distance shrinks; when FPS recovers, it expands back. Transitions are hidden by an animated distance fog that smoothly opens and closes, preventing visible chunk pop-in. Requires Sodium for optimal compatibility.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="[21,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sodium"
mandatory=true
versionRange="[0.6.0,)"
ordering="NONE"
side="CLIENT"
